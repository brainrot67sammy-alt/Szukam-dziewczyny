<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ szukam dziewczyny ❤️</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
            position: relative;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a9f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle { color: #888; margin-bottom: 25px; font-size: 0.95rem; }

        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #ffcce0;
            border-radius: 14px;
            font-size: 1.05rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: #ee5a9f; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0 10px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-group input { width: 20px; height: 20px; accent-color: #ee5a9f; cursor: pointer; }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a9f);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.15rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(238, 90, 159, 0.35);
        }
        .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(238, 90, 159, 0.45); }
        .btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

        .progress { font-size: 0.9rem; color: #ee5a9f; margin-bottom: 15px; font-weight: 600; }
        .question-text { font-size: 1.35rem; font-weight: 600; margin-bottom: 25px; line-height: 1.4; color: #222; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #fff5f7;
            border: 2px solid #ffcce0;
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 1.05rem;
            text-align: left;
        }
        .option:hover { background: #ffe6ef; border-color: #ff8fab; transform: translateY(-2px); }

        .score { font-size: 3.5rem; font-weight: 800; color: #ee5a9f; margin: 20px 0; }
        .score-text { font-size: 1.3rem; color: #555; margin-bottom: 10px; }

        .hidden { display: none !important; }

        #admin-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        #admin-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: rgba(255, 255, 255, 0.7);
        }

        #admin-panel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .admin-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
        }
        .admin-box h2 { margin-bottom: 8px; color: #ee5a9f; }
        .admin-box .count { color: #888; font-size: 0.9rem; margin-bottom: 18px; }

        .nick-list { list-style: none; margin: 10px 0 20px; }
        .nick-list li {
            padding: 12px 16px;
            background: #fff5f7;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
        }
        .nick-list .score-badge {
            background: #ee5a9f;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .no-nicks { color: #888; font-style: italic; padding: 10px 0; }
        .admin-close { width: 100%; }
    </style>
</head>
<body>

    <button id="admin-btn" onclick="openAdmin()">admin</button>

    <div class="container">
        <!-- START -->
        <div id="start-screen">
            <h1>❤️ szukam dziewczyny ❤️</h1>
            

            <div class="form-group">
                <label for="nickname">Twoja Ksywka:</label>
                <input type="text" id="nickname" placeholder="Wpisz ksywkę..." maxlength="25" autocomplete="off">
            </div>

            <label class="checkbox-group">
                <input type="checkbox" id="confirm-woman">
                <span>Na pewno jestem kobietą</span>
            </label>

            <button class="btn" id="start-btn" disabled onclick="startQuiz()">Rozpocznij Test</button>
        </div>

        <!-- QUIZ -->
        <div id="quiz-screen" class="hidden">
            <div class="progress" id="progress"></div>
            <div class="question-text" id="question-text"></div>
            <div class="options" id="options"></div>
        </div>

        <!-- RESULT -->
        <div id="result-screen" class="hidden">
            <h1>Koniec quizu!</h1>
            <p class="score-text">Twój wynik:</p>
            <div class="score" id="final-score">0/10</div>
            <p id="save-status" style="color:#888; font-size:0.95rem; margin-top:10px;"></p>
            <button class="btn" onclick="location.reload()">Zagraj jeszcze raz</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="hidden">
        <div class="admin-box">
            <h2>Panel Admina</h2>
            <div class="count" id="admin-count">Ładowanie...</div>
            <ul class="nick-list" id="nick-list"></ul>
            <button class="btn admin-close" onclick="closeAdmin()">Zamknij</button>
        </div>
    </div>

    <script>
        // ===== TWÓJ CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyCIz0Xj7l5Ly1eROsse1NS4o8RaFeOTS0U",
            authDomain: "szukam-dziewczyny.firebaseapp.com",
            databaseURL: "https://szukam-dziewczyny-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "szukam-dziewczyny",
            storageBucket: "szukam-dziewczyny.firebasestorage.app",
            messagingSenderId: "710945805037",
            appId: "1:710945805037:web:db7f24c2eb12bb8ccdf2e4",
            measurementId: "G-9SHB205XF2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const questions = [
            { q: "Ile masz lat?", options: ["0-7", "7-10", "10-13", "14-16"], correct: 3 },
            { q: "Co jest lepsze na pierwszą randkę?", options: ["Spacer i rozmowa", "Disco do rana", "Granie w gry 5 godzin", "Oglądanie meczów"], correct: 3 },
            { q: "Jaki klub jest najlepszy ?", options: ["Fc Bracelona", "Real Madryt", "Al Nassr", "Inter Miami"], correct: 0 },
            { q: "Jaki masz kolor włosów ?", options: ["Brązowy", "Blond", "Rudy", "Inny"], correct: 1 },
            { q: "Ile masz wzrostu, tak około?", options: ["0-120 cm", "120-150 cm", "150-170 cm", "więcej "], correct: 2 },
            { q: "Co jest ważniejsze w związku?", options: ["Zaufanie i komunikacja", "Pieniądze", "Wygląd", "Ile lajków ma na Insta"], correct: 0 },
            { q: "Jaki lubisz sport ", options: ["Siatkówkę", "Piłkę Nożną", "Koszykówka", "MMA"], correct: 1 },
            { q: "Czy miałaś już kiedyś chłopaka ", options: ["Nie", "Tak", "Tak, więcej niż 1-go ", "puste pole(nie klikać , stracisz punkt)"], correct: 0 },
            { q: "Jaki komplement jest najlepszy?", options: ["Szczery i konkretny", "„Ładnie wyglądasz… jak zawsze”", "Tylko o wyglądzie", "Żaden – nie chwal"], correct: 0 },
            { q: "Co jest największym red-flagiem?", options: ["Brak szacunku i kłamstwa", "Lubienie kotów", "Oglądanie seriali", "Picie kawy"], correct: 0 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let currentNickname = "";

        const nickInput = document.getElementById('nickname');
        const checkbox = document.getElementById('confirm-woman');
        const startBtn = document.getElementById('start-btn');

        function checkForm() {
            startBtn.disabled = !(nickInput.value.trim().length >= 2 && checkbox.checked);
        }
        nickInput.addEventListener('input', checkForm);
        checkbox.addEventListener('change', checkForm);

        function startQuiz() {
            currentNickname = nickInput.value.trim();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('progress').textContent = `Pytanie ${currentQuestion + 1} z 10`;
            document.getElementById('question-text').textContent = q.q;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.onclick = () => selectAnswer(index);
                optionsDiv.appendChild(div);
            });
        }

        function selectAnswer(selectedIndex) {
            if (selectedIndex === questions[currentQuestion].correct) score++;
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score}/10`;

            const status = document.getElementById('save-status');
            status.textContent = "Zapisywanie wyniku...";

            db.ref('wyniki').push({
                ksywka: currentNickname,
                wynik: score,
                data: new Date().toLocaleString('pl-PL')
            })
            .then(() => {
                status.textContent = "Wynik zapisany ✓";
                status.style.color = "#2ecc71";
            })
            .catch(err => {
                status.textContent = "Błąd zapisu – sprawdź reguły Firebase";
                status.style.color = "#e74c3c";
                console.error(err);
            });
        }

        function openAdmin() {
            const password = prompt("Hasło admina:");
            if (password === "domotokoks") {
                loadAdminData();
            } else if (password !== null) {
                alert("Złe hasło");
            }
        }

        function loadAdminData() {
            const list = document.getElementById('nick-list');
            const countEl = document.getElementById('admin-count');
            list.innerHTML = '<li class="no-nicks">Ładowanie...</li>';
            document.getElementById('admin-panel').classList.remove('hidden');

            db.ref('wyniki').once('value')
                .then(snapshot => {
                    const data = snapshot.val();
                    if (!data) {
                        list.innerHTML = '<li class="no-nicks">Brak wyników</li>';
                        countEl.textContent = "0 osób";
                        return;
                    }

                    const entries = Object.values(data).reverse();
                    countEl.textContent = `${entries.length} ${entries.length === 1 ? 'osoba' : 'osób'}`;

                    list.innerHTML = entries.map(e => `
                        <li>
                            <span>${e.ksywka}</span>
                            <span class="score-badge">${e.wynik}/10</span>
                        </li>
                    `).join('');
                })
                .catch(err => {
                    list.innerHTML = '<li class="no-nicks">Błąd ładowania danych</li>';
                    console.error(err);
                });
        }

        function closeAdmin() {
            document.getElementById('admin-panel').classList.add('hidden');
        }
    </script>
</body>
</html>
